<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OG</title>
<style>
  @font-face { font-family: 'Archivo'; src: url('file:///C:/Users/indomieG/Desktop/portfolio/.next/static/media/c214ffb7f5362987-s.p.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'Plex Sans'; src: url('file:///C:/Users/indomieG/Desktop/portfolio/.next/static/media/26d4368bf94c0ec4-s.p.woff2') format('woff2'); font-weight: 100 700; }
  @font-face { font-family: 'Plex Mono'; src: url('file:///C:/Users/indomieG/Desktop/portfolio/.next/static/media/af5dd2b5d3f396f3-s.p.woff2') format('woff2'); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #070B14; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #EEF2F8; font-family: 'Plex Sans', sans-serif; }
  .grid { position: absolute; inset: 0;
    background-image:
      linear-gradient(rgb(120 160 255 / 0.075) 1px, transparent 1px),
      linear-gradient(90deg, rgb(120 160 255 / 0.075) 1px, transparent 1px),
      linear-gradient(rgb(120 160 255 / 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgb(120 160 255 / 0.035) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: -1px -1px; }
  .glow { position: absolute; inset: 0; background: radial-gradient(70% 90% at 78% 10%, rgb(120 160 255 / 0.14), transparent 60%); }
  .fade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 70%, rgb(7 11 20 / 0.9)); }
  svg.sky { position: absolute; inset: 0; }
  .left { position: absolute; left: 72px; top: 74px; width: 700px; }
  .kicker { font-family: 'Plex Mono', monospace; font-weight: 500; font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase; color: #E8B864; display: flex; align-items: center; gap: 14px; }
  .kicker i { display: inline-block; width: 36px; height: 1px; background: currentColor; opacity: .7; }
  h1 { font-family: 'Archivo', sans-serif; font-weight: 800; font-variation-settings: 'wdth' 112; font-size: 96px; line-height: 1; letter-spacing: -0.02em; margin-top: 30px; }
  .role { margin-top: 18px; font-size: 25px; color: #A7B3C7; font-weight: 500; }
  .headline { margin-top: 34px; font-family: 'Archivo', sans-serif; font-weight: 650; font-variation-settings: 'wdth' 100; font-size: 37px; line-height: 1.18; letter-spacing: -0.01em; }
  .headline span { color: #8391AA; }
  .chips { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 26px; align-items: center; font-size: 19px; color: #A7B3C7; }
  .chip { display: inline-flex; align-items: center; gap: 10px; }
  .chip b { width: 13px; height: 13px; border-radius: 2px; display: inline-block; }
  .avail { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border: 1px solid #2F3D5C; border-radius: 999px; color: #EEF2F8; font-weight: 600; background: rgb(14 21 38 / .7); }
  .avail b { width: 10px; height: 10px; border-radius: 99px; background: #5ED6B4; display: inline-block; }
  .photo { position: absolute; right: 74px; top: 74px; width: 300px; height: 375px; border: 1px solid #2F3D5C; border-radius: 6px; overflow: hidden; background: #141D33; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .marks { position: absolute; right: 67px; top: 67px; width: 314px; height: 389px; pointer-events: none;
    --m: rgb(131 145 170 / .8);
    background:
      linear-gradient(var(--m), var(--m)) top left / 14px 1px no-repeat, linear-gradient(var(--m), var(--m)) top left / 1px 14px no-repeat,
      linear-gradient(var(--m), var(--m)) top right / 14px 1px no-repeat, linear-gradient(var(--m), var(--m)) top right / 1px 14px no-repeat,
      linear-gradient(var(--m), var(--m)) bottom left / 14px 1px no-repeat, linear-gradient(var(--m), var(--m)) bottom left / 1px 14px no-repeat,
      linear-gradient(var(--m), var(--m)) bottom right / 14px 1px no-repeat, linear-gradient(var(--m), var(--m)) bottom right / 1px 14px no-repeat; }
  .cart { position: absolute; right: 74px; top: 466px; width: 300px; display: grid; grid-template-columns: 1fr 1fr; border-left: 1px solid #32405F; border-top: 1px solid #32405F;
    font-family: 'Plex Mono', monospace; font-weight: 500; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #8391AA; }
  .cart div { border-right: 1px solid #32405F; border-bottom: 1px solid #32405F; padding: 9px 12px; line-height: 1.5; }
  .cart div span { display: block; color: #A7B3C7; }
</style>
</head>
<body>
<div class="og">
  <div class="glow"></div>
  <div class="grid"></div>
  <svg class="sky" id="sky" viewBox="0 0 1200 630"></svg>
  <div class="fade"></div>

  <div class="left">
    <p class="kicker"><i></i>Portfolio d’ingénieure</p>
    <h1>Ghada Turki</h1>
    <p class="role">Ingénieure en génie électromécanique, spécialité mécatronique</p>
    <p class="headline">Je dessine la pièce, je câble la carte,<br><span>j’écris le code.</span></p>
  </div>

  <div class="chips">
    <span class="chip"><b style="background:#8CB4FF"></b>Mécanique</span>
    <span class="chip"><b style="background:#5ED6B4"></b>Électronique &amp; Automatisme</span>
    <span class="chip"><b style="background:#B9A2FF"></b>Logiciel &amp; IA</span>
  </div>

  <div class="photo"><img src="file:///C:/Users/indomieG/Desktop/portfolio/public/ghada-turki-photo.jpg" alt=""></div>
  <div class="marks"></div>
  <div class="cart">
    <div>ESPRIT<span>2024 – 2026</span></div>
    <div>Disponibilité<span style="color:#5ED6B4">Immédiate</span></div>
  </div>
</div>
<script>
  // ciel : étoiles déterministes + quelques liaisons fines
  let a = 20261114 >>> 0
  const rnd = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
  const svg = document.getElementById('sky'); const ns = 'http://www.w3.org/2000/svg'
  const pts = []
  for (let i = 0; i < 110; i++) {
    const x = rnd() * 1200, y = rnd() * 630, r = 0.5 + rnd() * 1.4, o = 0.25 + rnd() * 0.6
    if (x > 780 && x < 1150 && y > 50 && y < 560) continue
    pts.push([x, y])
    const c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r)
    c.setAttribute('fill', i % 23 === 0 ? '#E8B864' : '#E2EAF8'); c.setAttribute('opacity', o); svg.appendChild(c)
  }
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1])
    if (d < 70) { const l = document.createElementNS(ns, 'line'); l.setAttribute('x1', pts[i][0]); l.setAttribute('y1', pts[i][1]); l.setAttribute('x2', pts[j][0]); l.setAttribute('y2', pts[j][1]); l.setAttribute('stroke', '#E2EAF8'); l.setAttribute('stroke-opacity', (0.12 * (1 - d / 70)).toFixed(3)); svg.appendChild(l) }
  }
</script>
</body>
</html>
